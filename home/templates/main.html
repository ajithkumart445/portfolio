<!DOCTYPE html>
<html class="dark scroll-smooth" lang="en">

<head>
    {% load static %}
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ajithkumar T. | AI/ML Engineer & Data Scientist{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Portfolio of Ajithkumar T. — AI/ML Engineer & Data Scientist transforming data into intelligent, impactful solutions.{% endblock %}">

    <!-- Canonical URL -->
    <link rel="canonical" href="{% block canonical_url %}{{ request.build_absolute_uri }}{% endblock %}">

    <!-- Open Graph / LinkedIn / Facebook -->
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    <meta property="og:title" content="{% block og_title %}Ajithkumar T. | AI/ML Engineer & Data Scientist{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Portfolio of Ajithkumar T. — AI/ML Engineer & Data Scientist transforming data into intelligent, impactful solutions.{% endblock %}">
    <meta property="og:image" content="{% block og_image %}{{ request.scheme }}://{{ request.get_host }}{% static 'profilepic.jpeg' %}{% endblock %}">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ request.build_absolute_uri }}">
    <meta name="twitter:title" content="{% block twitter_title %}Ajithkumar T. | AI/ML Engineer & Data Scientist{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Portfolio of Ajithkumar T. — AI/ML Engineer & Data Scientist transforming data into intelligent, impactful solutions.{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}{{ request.scheme }}://{{ request.get_host }}{% static 'profilepic.jpeg' %}{% endblock %}">

    <!-- Structured Data (JSON-LD) -->
    {% block json_ld %}{% endblock %}

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">

    <!-- Tailwind CDN v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans: "Inter", sans-serif;
            --font-mono: "JetBrains Mono", monospace;
            --color-slate-950: #020617;
        }
    </style>

    <style>
        body {
            background-color: #020617;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        /* Gradient text utility */
        .gradient-text {
            background: linear-gradient(135deg, #06b6d4, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Gradient underline for headings */
        .gradient-underline {
            position: relative;
            display: inline-block;
        }

        .gradient-underline::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -8px;
            width: 100%;
            height: 3px;
            background: linear-gradient(135deg, #06b6d4, #a855f7);
            border-radius: 2px;
        }

        /* Gradient button */
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .btn-gradient:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Background animated grid */
        .bg-grid {
            background-image: linear-gradient(to right, #1e293b 1px, transparent 1px),
                linear-gradient(to bottom, #1e293b 1px, transparent 1px);
            background-size: 64px 64px;
        }

        /* Scroll reveal */
        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .reveal.visible {
            opacity: 1;
            transform: none;
        }

        /* Card hover */
        .project-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(6, 182, 212, 0.12);
        }

        .blog-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .blog-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(168, 85, 247, 0.12);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #020617;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #06b6d4;
        }

        /* Orbs */
        @keyframes orb-pulse {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        .orb {
            animation: orb-pulse 8s ease-in-out infinite;
        }

        .orb-2 {
            animation: orb-pulse 8s ease-in-out infinite;
            animation-delay: -4s;
        }
    </style>
</head>

<body class="selection:bg-cyan-500/20 selection:text-cyan-300 overflow-x-hidden">

                </div>
            </div>
        </div>
    </footer>

    <script>
        // Scroll reveal — also immediately reveal elements already in the viewport
        const revealEls = document.querySelectorAll('.reveal');
        const revealObs = new IntersectionObserver(entries => {
            entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); } });
        }, { threshold: 0.06, rootMargin: '0px 0px -40px 0px' });
        revealEls.forEach(el => revealObs.observe(el));
    </script>
</body>

</html>
